name: Release

# A v* tag publishes the image. Every Monday the latest release is rebuilt on fresh base
# images (ClamAV fixes, newer bundled signatures); installed servers pick it up by themselves.
on:
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the release to build
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$(git tag --list 'v*.*.*' --sort=-v:refname | { grep -v -- - || true; } | awk 'NR == 1')"
            if [[ -z "$tag" ]]; then
              echo "No release yet: nothing to rebuild."
              exit 0
            fi
            git checkout --quiet "$tag"
          fi
          version="${tag#v}"
          grep -qx "version = \"$version\"" Cargo.toml || {
            echo "Cargo.toml does not declare version $version" >&2
            exit 1
          }
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "stable=$([[ "$tag" == *-* ]] && echo false || echo true)" >>"$GITHUB_OUTPUT"
          # Image names must be lowercase; the repository is drslid/FileFender.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.release.outputs.tag
      - name: Build for the test
        if: steps.release.outputs.tag
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          tags: filefender:test
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - name: End-to-end test before publishing
        if: steps.release.outputs.tag
        run: |
          docker run -d --name filefender -p 127.0.0.1:8080:8080 --read-only \
            --tmpfs /tmp:size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true \
            --health-interval 5s filefender:test
          for _ in $(seq 1 90); do
            [[ "$(docker inspect --format '{{.State.Health.Status}}' filefender)" == healthy ]] && break
            sleep 5
          done
          key="$(docker exec filefender filefender keys create release | grep -E '^ff_')"
          echo "::add-mask::$key"
          FILEFENDER_URL=http://127.0.0.1:8080 FILEFENDER_KEY="$key" scripts/smoke-test.sh
      - name: Container logs
        if: failure() && steps.release.outputs.tag
        run: docker logs filefender 2>&1 | tail -n 150

      - uses: docker/login-action@v4
        if: steps.release.outputs.tag
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.release.outputs.tag
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }},enable=${{ !startsWith(steps.release.outputs.tag, 'v0.') }}
            type=raw,value=stable,enable=${{ steps.release.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}
      - name: Publish linux/amd64 and linux/arm64
        if: steps.release.outputs.tag
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          args=(--verify-tag --generate-notes)
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
