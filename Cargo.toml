[package]
name = "filefender"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Self-hosted malware scanning API: ClamAV and YARA-X in one container, with automatic HTTPS and updates"
license = "MIT"
repository = "https://github.com/drslid/FileFender"
publish = false

[profile.release]
lto = "thin"
strip = "symbols"

# Unoptimized Argon2 takes seconds per hash and slows the test suite down.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
axum-server = "0.8.0"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
infer = "0.22.0"
ipnet = "2.12.2"
moka = { version = "0.12.16", features = ["sync"] }
nix = { version = "0.31.3", features = ["socket", "uio", "process", "signal"] }
qrcode = { version = "0.14.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2", "json", "form", "query"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "webpki-roots", "tokio", "axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
webpki-roots = "1.0.9"
yara-x = "1.21.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
